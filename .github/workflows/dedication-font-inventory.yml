name: e306-dedication-font-inventory

on:
  workflow_dispatch:
  push:
    branches:
      - paper/e306-anchor-fibre-v1
    paths:
      - '.github/workflows/dedication-font-inventory.yml'

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX font inventory
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-fonts-extra texlive-fonts-recommended texlive-xetex
      - name: List plausible Greek serif OpenType faces
        run: |
          ROOT="$(kpsewhich -var-value=TEXMFROOT)"
          echo "TEXMFROOT=$ROOT"
          find "$ROOT" -type f \( -iname '*.otf' -o -iname '*.ttf' \) \
            | grep -Ei '/(gfs|ebgaramond|libertinus|oldstandard|stix|freefont|noto).*\.(otf|ttf)$' \
            | sort \
            | tee dedication-font-candidates.txt
          echo
          echo '--- likely named candidates ---'
          for f in \
            EBGaramond-Regular.otf EBGaramond-Medium.otf EBGaramond-SemiBold.otf \
            GFSArtemisia.otf GFSArtemisiaBold.otf GFSDidot.otf GFSBodoni.otf \
            GFSNeohellenic.otf GFSPorson.otf GFSComplutum.otf GFSElpis.otf \
            OldStandard-Regular.otf LibertinusSerif-Regular.otf STIXTwoText-Regular.otf; do
            p="$(kpsewhich "$f" || true)"
            test -n "$p" && printf '%s -> %s\n' "$f" "$p"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: e306-dedication-font-inventory-${{ github.sha }}
          path: dedication-font-candidates.txt
          retention-days: 7