name: temporary-e306-dedication-optical-ladder

on:
  push:
    branches:
      - verification/e306-dedication-optical-ladder

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Freeze manuscript bytes
        run: |
          git diff --exit-code d21c612be5c3534b3b2b40361c4a861f40969565 -- \
            paper/e306-anchor-fibre-v1/manuscript/main.tex \
            paper/e306-anchor-fibre-v1/manuscript/references.bib \
            paper/e306-anchor-fibre-v1/manuscript/sections

      - name: Install TeX and render tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            biber curl imagemagick poppler-utils unzip \
            texlive-bibtex-extra texlive-fonts-extra texlive-fonts-recommended \
            texlive-latex-extra texlive-plain-generic texlive-xetex
          kpsewhich ETbb-Regular.otf
          kpsewhich STIXTwoText-Medium.otf
          kpsewhich GFSPorson.otf

      - name: Download Gentium Book 7.000 upstream
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            https://github.com/silnrsi/font-gentium/releases/download/v7.000/GentiumBook-7.000.zip \
            -o /tmp/GentiumBook-7.000.zip
          echo 'fa4e35bcea62dd68befabf4bb7c2765aacd2691f51ec8ae008f5f913ef49f419  /tmp/GentiumBook-7.000.zip' | sha256sum -c -
          unzip -q /tmp/GentiumBook-7.000.zip -d /tmp/gentium-release
          find /tmp/gentium-release -type f \( -name 'GentiumBook-Medium.ttf' -o -name 'GentiumBook-SemiBold.ttf' \) -print

      - name: Build optical ladder
        shell: bash
        run: |
          set -euo pipefail
          SRC=paper/e306-anchor-fibre-v1/manuscript
          MED="$(find /tmp/gentium-release -type f -name 'GentiumBook-Medium.ttf' -print -quit)"
          SEMI="$(find /tmp/gentium-release -type f -name 'GentiumBook-SemiBold.ttf' -print -quit)"
          test -n "$MED"; test -n "$SEMI"

          build_variant () {
            name="$1"; face="$2"; size="$3"; track="$4"
            dir="/tmp/$name"
            cp -a "$SRC" "$dir"
            if [ "$face" = gentium-medium ]; then
              cp "$MED" "$dir/GentiumBook-Medium.ttf"
              FACEFILE='GentiumBook-Medium.ttf'
            elif [ "$face" = gentium-semibold ]; then
              cp "$SEMI" "$dir/GentiumBook-SemiBold.ttf"
              FACEFILE='GentiumBook-SemiBold.ttf'
            elif [ "$face" = porson ]; then
              FACEFILE='GFSPorson.otf'
            else
              FACEFILE='STIXTwoText-Medium.otf'
            fi
            python3 - "$dir/main.tex" "$FACEFILE" "$size" "$track" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); face,size,track=sys.argv[2:]
          s=p.read_text(encoding='utf-8')
          s=s.replace(r'\newfontfamily\greekdedicationfont{STIXTwoText-Medium.otf}[',
                      rf'\newfontfamily\greekdedicationfont{{{face}}}[',1)
          s=s.replace('LetterSpace=9',f'LetterSpace={track}',1)
          s=s.replace(r'\fontsize{10.5}{16}',rf'\fontsize{{{size}}}{{16}}',1)
          p.write_text(s,encoding='utf-8')
          PY
            (cd "$dir" && xelatex -interaction=nonstopmode -halt-on-error main.tex >/dev/null && biber main >/dev/null && xelatex -interaction=nonstopmode -halt-on-error main.tex >/dev/null && xelatex -interaction=nonstopmode -halt-on-error main.tex >/dev/null)
            test "$(pdfinfo "$dir/main.pdf" | awk '/^Pages:/ {print $2}')" = 36
            pdftoppm -f 1 -singlefile -png -r 180 "$dir/main.pdf" "/tmp/${name}-page1" >/dev/null 2>&1
            rm -f "$dir"/*.ttf
          }

          build_variant STIX-current stix 10.5 9
          build_variant Gentium-M-10.75-LS11 gentium-medium 10.75 11
          build_variant Gentium-M-11-LS12 gentium-medium 11 12
          build_variant Gentium-SB-10.25-LS10 gentium-semibold 10.25 10
          build_variant Porson-10.5-LS9 porson 10.5 9

      - name: Make comparison sheet
        run: |
          mkdir -p /tmp/out
          for f in /tmp/*-page1.png; do cp "$f" /tmp/out/; done
          montage \
            /tmp/STIX-current-page1.png \
            /tmp/Gentium-M-10.75-LS11-page1.png \
            /tmp/Gentium-M-11-LS12-page1.png \
            /tmp/Gentium-SB-10.25-LS10-page1.png \
            /tmp/Porson-10.5-LS9-page1.png \
            -thumbnail 32% -tile 5x1 -geometry +12+0 -background white \
            /tmp/out/optical-ladder.png

      - uses: actions/upload-artifact@v4
        with:
          name: e306-dedication-optical-ladder-${{ github.sha }}
          path: /tmp/out/
          if-no-files-found: error
          retention-days: 7
