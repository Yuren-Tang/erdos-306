name: E306 manuscript warning fix

on:
  push:
    branches:
      - paper/arxiv-v1-revision-v1

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact TeX warning repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('paper/main.tex')
          text = path.read_text()
          old = r'\begin{description}[style=nextline,leftmargin=0pt,labelindent=0pt]'
          new = r'\begin{description}[style=nextline,leftmargin=!,labelindent=0pt]'
          assert text.count(old) == 1
          path.write_text(text.replace(old, new))
          PY
          test "$(git hash-object paper/main.tex)" = "d89d1c57d88728d4cff41e78b46e044a930f9703"
          test "$(wc -c < paper/main.tex | tr -d '[:space:]')" = "49994"
          rm .github/workflows/e306-warning-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "paper: remove enumitem warning"
          git push origin HEAD:paper/arxiv-v1-revision-v1
