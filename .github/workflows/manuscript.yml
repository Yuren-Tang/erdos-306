name: verify-e306-manuscript

# Manuscript verification runs automatically when the review manuscript or this
# workflow changes on the article branch. Manual dispatch remains available for
# explicit clean-room rebuilds before publication or external review.

on:
  workflow_dispatch:
  push:
    branches:
      - paper/e306-anchor-fibre-v1
    paths:
      - 'paper/e306-anchor-fibre-v1/manuscript/**'
      - '.github/workflows/manuscript.yml'

jobs:
  build-manuscript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: paper/e306-anchor-fibre-v1/manuscript

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify frozen mathematical source
        run: |
          git diff --exit-code fe009a1bcd8eff3c0ef1eafaf487563fedf3ae0a -- \
            main.tex references.bib sections

      - name: Guard Oxford manuscript spelling
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          files = [Path("main.tex"), *sorted(Path("sections").glob("*.tex"))]
          forbidden = {
              r"\bcentered\b": "centred",
              r"\bfibers?\b": "fibre/fibres",
              r"\banalyz(?:e|ed|es|ing)\b": "analyse/analysed/analyses/analysing",
              r"\bbehavior(?:s|al)?\b": "behaviour...",
              r"\blabel(?:ed|ing)\b": "labelled/labelling",
              r"\bmodel(?:ed|ing)\b": "modelled/modelling",
              r"\bcharacteris(?:e|ed|es|ing|ation|ations)\b": "characteriz...",
              r"\bnormalis(?:e|ed|es|ing|ation|ations)\b": "normaliz...",
              r"\borganis(?:e|ed|es|ing|ation|ations)\b": "organiz...",
              r"\brealis(?:e|ed|es|ing|ation|ations)\b": "realiz...",
              r"\brecognis(?:e|ed|es|ing|ation|ations)\b": "recogniz...",
              r"\bstandardis(?:e|ed|es|ing|ation|ations)\b": "standardiz...",
              r"\boptimis(?:e|ed|es|ing|ation|ations)\b": "optimiz...",
              r"\bminimis(?:e|ed|es|ing|ation|ations)\b": "minimiz...",
              r"\bmaximis(?:e|ed|es|ing|ation|ations)\b": "maximiz...",
              r"\bsummaris(?:e|ed|es|ing|ation|ations)\b": "summariz...",
          }
          bad = []
          for path in files:
              text = path.read_text(encoding="utf-8")
              for pattern, preferred in forbidden.items():
                  for match in re.finditer(pattern, text, flags=re.IGNORECASE):
                      line = text.count("\n", 0, match.start()) + 1
                      bad.append(f"{path}:{line}: {match.group(0)!r} -> prefer {preferred}")
          if bad:
              raise SystemExit("Oxford-spelling guard failed:\n" + "\n".join(bad))
          PY

      - name: Install TeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk \
            biber \
            poppler-utils \
            fonts-gfs-artemisia \
            texlive-bibtex-extra \
            texlive-fonts-extra \
            texlive-fonts-recommended \
            texlive-latex-extra \
            texlive-plain-generic \
            texlive-xetex

      - name: Verify required typography files
        run: |
          kpsewhich ETbb-Regular.otf
          kpsewhich ETbb-Bold.otf
          kpsewhich ETbb-Italic.otf
          kpsewhich ETbb-BoldItalic.otf
          kpsewhich newtxmath.sty
          kpsewhich EBGaramond-Regular.otf
          fc-match "EB Garamond" | tee /tmp/eb-garamond-match.txt
          grep -Eqi "EB.?Garamond|Garamond" /tmp/eb-garamond-match.txt

      - name: Clean XeLaTeX and Biber build
        shell: bash
        run: |
          set -o pipefail
          make clean
          make pdf 2>&1 | tee build-output.log

      - name: Extract PDF text
        if: always()
        run: |
          if test -s main.pdf; then
            pdftotext -enc UTF-8 main.pdf main.txt
          fi

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e306-manuscript-diagnostics-${{ github.sha }}
          path: |
            paper/e306-anchor-fibre-v1/manuscript/build-output.log
            paper/e306-anchor-fibre-v1/manuscript/main.log
            paper/e306-anchor-fibre-v1/manuscript/main.blg
            paper/e306-anchor-fibre-v1/manuscript/main.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Gate bibliography, references, labels, glyph coverage, and overflow
        run: |
          test -s main.pdf
          test -s main.bbl
          if grep -E "LaTeX Warning: (There were undefined references|Citation .* undefined|Reference .* undefined|Label .* multiply defined)" main.log; then
            echo "::error::unresolved or duplicate references remain"
            exit 1
          fi
          if grep -E "There were undefined references|undefined citations|multiply-defined labels" main.log; then
            echo "::error::unresolved or duplicate references remain"
            exit 1
          fi
          if grep -q "Missing character:" main.log; then
            echo "::error::the final TeX pass contains missing glyphs"
            grep "Missing character:" main.log
            exit 1
          fi
          if grep -Fq 'Overfull \hbox' main.log; then
            echo "::error::the final TeX pass contains an overfull hbox"
            grep -F 'Overfull \hbox' main.log
            exit 1
          fi
          if grep -E "(^|[[:space:]])(WARN|ERROR) -" main.blg; then
            echo "::error::Biber reported a warning or error"
            exit 1
          fi

      - name: Verify embedded fonts, Unicode dedication, and ORCID
        run: |
          pdffonts main.pdf | tee main-fonts.txt
          if grep -q "Type 3" main-fonts.txt; then
            echo "::error::Type 3 fonts are not permitted"
            exit 1
          fi
          awk 'NR > 2 && $(NF-4) != "yes" { bad=1 } END { exit bad }' main-fonts.txt
          grep -Eqi "EB.?Garamond|Garamond" main-fonts.txt
          python3 - <<'PY'
          import re
          import unicodedata
          from pathlib import Path
          text = unicodedata.normalize("NFC", Path("main.txt").read_text(encoding="utf-8"))
          required = [
              "ΤΟΙΣ ΕΜΕ ΦΙΛΟΥΣΙΝ",
              "ΚΑΙ ΟΙΣ ΦΙΛΩ",
              "0009-0006-0847-3330",
              "Erdős",
          ]
          missing = [s for s in required if s not in text]
          if missing:
            raise SystemExit("Required dedication/identity/text extraction failed: " + repr(missing))
          leaked = sorted(set(re.findall(r"\b(?:eq|thm|sec|lem|prop):[A-Za-z0-9_.:-]+", text)))
          if leaked:
            raise SystemExit("Internal LaTeX label names leaked into PDF text: " + repr(leaked))
          PY

      - name: Build summary
        run: |
          {
            echo "## E306 EB Garamond dedication test build"
            echo
            echo "- Commit: $GITHUB_SHA"
            echo "- Frozen manuscript source: \`fe009a1bcd8eff3c0ef1eafaf487563fedf3ae0a\` (main.tex + references + sections)"
            echo "- Entry point: \`paper/e306-anchor-fibre-v1/manuscript/main.tex\`"
            echo "- Engine: XeLaTeX"
            echo "- Body text/math typography: ETbb OpenType / NewTX"
            echo "- Dedication typography: EB Garamond OpenType"
            echo "- Bibliography backend/style: Biber / numeric"
            echo "- PDF size: $(stat -c%s main.pdf) bytes"
            echo "- Pages: $(pdfinfo main.pdf | awk '/^Pages:/ {print $2}')"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload manuscript PDF
        uses: actions/upload-artifact@v4
        with:
          name: e306-eb-garamond-dedication-test-pdf-${{ github.sha }}
          path: paper/e306-anchor-fibre-v1/manuscript/main.pdf
          if-no-files-found: error
          retention-days: 30
