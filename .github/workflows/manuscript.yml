name: verify-e306-manuscript

on:
  pull_request:
    paths:
      - "paper/e306-anchor-fibre-v1/manuscript/**"
      - ".github/workflows/manuscript.yml"
  workflow_dispatch:

jobs:
  build-manuscript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: paper/e306-anchor-fibre-v1/manuscript

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install TeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk \
            biber \
            poppler-utils \
            tex-gyre \
            fonts-texgyre \
            fonts-gfs-porson \
            fonts-inconsolata \
            texlive-bibtex-extra \
            texlive-fonts-extra \
            texlive-fonts-recommended \
            texlive-latex-extra \
            texlive-plain-generic \
            texlive-xetex

      - name: Verify required font families
        run: |
          fc-match "TeX Gyre Pagella" | tee /tmp/pagella-match.txt
          fc-match "GFS Porson" | tee /tmp/porson-match.txt
          fc-match "Inconsolata" | tee /tmp/inconsolata-match.txt
          grep -qi "pagella" /tmp/pagella-match.txt
          grep -qi "porson" /tmp/porson-match.txt
          grep -qi "inconsolata" /tmp/inconsolata-match.txt

      - name: Clean XeLaTeX and Biber build
        shell: bash
        run: |
          set -o pipefail
          make clean
          make pdf 2>&1 | tee build-output.log

      - name: Extract PDF text
        if: always()
        run: |
          if test -s main.pdf; then
            pdftotext -enc UTF-8 main.pdf main.txt
          fi

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e306-manuscript-diagnostics-${{ github.sha }}
          path: |
            paper/e306-anchor-fibre-v1/manuscript/build-output.log
            paper/e306-anchor-fibre-v1/manuscript/main.log
            paper/e306-anchor-fibre-v1/manuscript/main.blg
            paper/e306-anchor-fibre-v1/manuscript/main.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Gate bibliography, references, and labels
        run: |
          test -s main.pdf
          test -s main.bbl
          if grep -E "LaTeX Warning: (There were undefined references|Citation .* undefined|Reference .* undefined|Label .* multiply defined)" main.log; then
            echo "::error::unresolved or duplicate references remain"
            exit 1
          fi
          if grep -E "There were undefined references|undefined citations|multiply-defined labels" main.log; then
            echo "::error::unresolved or duplicate references remain"
            exit 1
          fi
          if grep -E "(^|[[:space:]])(WARN|ERROR) -" main.blg; then
            echo "::error::Biber reported a warning or error"
            exit 1
          fi

      - name: Verify embedded fonts and Unicode dedication
        run: |
          pdffonts main.pdf | tee main-fonts.txt
          if grep -q "Type 3" main-fonts.txt; then
            echo "::error::Type 3 fonts are not permitted"
            exit 1
          fi
          awk 'NR > 2 && $(NF-4) != "yes" { bad=1 } END { exit bad }' main-fonts.txt
          python3 - <<'PY'
          import unicodedata
          from pathlib import Path
          text = unicodedata.normalize("NFC", Path("main.txt").read_text(encoding="utf-8"))
          required = ["τοῖς ἐμὲ φιλοῦσιν", "καὶ οἷς φιλῶ"]
          missing = [s for s in required if s not in text]
          if missing:
              raise SystemExit("Unicode dedication extraction failed: " + repr(missing))
          PY

      - name: Build summary
        run: |
          {
            echo "## E306 manuscript build"
            echo
            echo "- Commit: $GITHUB_SHA"
            echo "- Entry point: \`paper/e306-anchor-fibre-v1/manuscript/main.tex\`"
            echo "- Command: \`make clean && make pdf\`"
            echo "- Engine: XeLaTeX"
            echo "- Bibliography backend: Biber"
            echo "- Result: clean PDF build, bibliography/reference/label gate, font-embedding gate, and Unicode-dedication extraction gate passed"
            echo "- PDF size: $(stat -c%s main.pdf) bytes"
            echo "- Pages: $(pdfinfo main.pdf | awk '/^Pages:/ {print $2}')"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload manuscript PDF
        uses: actions/upload-artifact@v4
        with:
          name: e306-manuscript-${{ github.sha }}
          path: paper/e306-anchor-fibre-v1/manuscript/main.pdf
          if-no-files-found: error
          retention-days: 30
