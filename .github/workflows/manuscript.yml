name: verify-e306-manuscript

on:
  pull_request:
    paths:
      - "paper/e306-anchor-fibre-v1/manuscript/**"
      - ".github/workflows/manuscript.yml"
  workflow_dispatch:

jobs:
  build-manuscript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: paper/e306-anchor-fibre-v1/manuscript

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install TeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk \
            lmodern \
            texlive-bibtex-extra \
            texlive-fonts-recommended \
            texlive-latex-extra

      - name: Clean build
        run: |
          make clean
          make pdf

      - name: Gate unresolved references and citations
        run: |
          test -s main.pdf
          if grep -E "LaTeX Warning: (There were undefined references|Citation .* undefined|Reference .* undefined)" main.log; then
            echo "::error::unresolved references or citations remain"
            exit 1
          fi
          if grep -E "There were undefined references|undefined citations" main.log; then
            echo "::error::unresolved references or citations remain"
            exit 1
          fi

      - name: Build summary
        run: |
          {
            echo "## E306 manuscript build"
            echo
            echo "- Commit: $GITHUB_SHA"
            echo "- Entry point: \`paper/e306-anchor-fibre-v1/manuscript/main.tex\`"
            echo "- Command: \`make clean && make pdf\`"
            echo "- Result: clean PDF build passed"
            echo "- PDF size: $(stat -c%s main.pdf) bytes"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload manuscript PDF
        uses: actions/upload-artifact@v4
        with:
          name: e306-manuscript-${{ github.sha }}
          path: paper/e306-anchor-fibre-v1/manuscript/main.pdf
          if-no-files-found: error
          retention-days: 30
