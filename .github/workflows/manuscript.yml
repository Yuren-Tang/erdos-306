name: verify-e306-manuscript

on:
  pull_request:
    paths:
      - "paper/e306-anchor-fibre-v1/manuscript/**"
      - ".github/workflows/manuscript.yml"
  workflow_dispatch:

jobs:
  build-manuscript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: paper/e306-anchor-fibre-v1/manuscript

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install TeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk \
            lmodern \
            poppler-utils \
            texlive-bibtex-extra \
            texlive-fonts-extra \
            texlive-fonts-recommended \
            texlive-lang-greek \
            texlive-latex-extra \
            texlive-plain-generic

      - name: Clean BibTeX build
        shell: bash
        run: |
          set -o pipefail
          make clean
          make pdf 2>&1 | tee build-output.log

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e306-manuscript-diagnostics-${{ github.sha }}
          path: |
            paper/e306-anchor-fibre-v1/manuscript/build-output.log
            paper/e306-anchor-fibre-v1/manuscript/main.log
            paper/e306-anchor-fibre-v1/manuscript/main.blg
          if-no-files-found: warn
          retention-days: 30

      - name: Gate bibliography, references, and labels
        run: |
          test -s main.pdf
          test -s main.bbl
          if grep -E "LaTeX Warning: (There were undefined references|Citation .* undefined|Reference .* undefined|Label .* multiply defined)" main.log; then
            echo "::error::unresolved or duplicate references remain"
            exit 1
          fi
          if grep -E "There were undefined references|undefined citations|multiply-defined labels" main.log; then
            echo "::error::unresolved or duplicate references remain"
            exit 1
          fi
          if grep -E "^Warning--" main.blg; then
            echo "::error::BibTeX reported a warning"
            exit 1
          fi

      - name: Verify embedded fonts
        run: |
          pdffonts main.pdf | tee main-fonts.txt
          if grep -q "Type 3" main-fonts.txt; then
            echo "::error::Type 3 fonts are not permitted"
            exit 1
          fi
          awk 'NR > 2 && $(NF-4) != "yes" { bad=1 } END { exit bad }' main-fonts.txt

      - name: Build summary
        run: |
          {
            echo "## E306 manuscript build"
            echo
            echo "- Commit: $GITHUB_SHA"
            echo "- Entry point: \`paper/e306-anchor-fibre-v1/manuscript/main.tex\`"
            echo "- Command: \`make clean && make pdf\`"
            echo "- Bibliography backend: BibTeX"
            echo "- Result: clean PDF build, bibliography/reference/label gate, and font-embedding gate passed"
            echo "- PDF size: $(stat -c%s main.pdf) bytes"
            echo "- Pages: $(pdfinfo main.pdf | awk '/^Pages:/ {print $2}')"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload manuscript PDF
        uses: actions/upload-artifact@v4
        with:
          name: e306-manuscript-${{ github.sha }}
          path: paper/e306-anchor-fibre-v1/manuscript/main.pdf
          if-no-files-found: error
          retention-days: 30
